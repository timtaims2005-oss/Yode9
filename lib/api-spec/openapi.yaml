components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenericObject:
      type: object
      description: >-
        Unstructured JSON object. Exact shape is defined by the route implementation; see
        artifacts/api-server/src/routes for field-level detail.
      additionalProperties: true
    GenericSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/GenericObject'
      required:
        - success
    GenericErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
      required:
        - success
        - error
  securitySchemes:
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key
      description: Internal service-to-service API key (INTERNAL_API_KEY). Required for all routes not explicitly marked public.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: End-user session/JWT bearer token.
