apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr7-api
  namespace: mr7ai
  labels:
    app: mr7-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mr7-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mr7-api
        tier: backend
    spec:
      containers:
        - name: api
          image: mr7ai/api-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mr7-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mr7-secrets
                  key: redis-url
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: mr7-secrets
                  key: session-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mr7-secrets
                  key: openai-api-key
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mr7-secrets
                  key: internal-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
