apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mr7-api-hpa
  namespace: mr7ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mr7-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mr7-frontend-hpa
  namespace: mr7ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mr7-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
