apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: mr7ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr7-postgres
  namespace: mr7ai
  labels:
    app: mr7-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mr7-postgres
  template:
    metadata:
      labels:
        app: mr7-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: mr7ai
            - name: POSTGRES_USER
              value: mr7user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mr7-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mr7user", "-d", "mr7ai"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mr7-postgres-svc
  namespace: mr7ai
spec:
  selector:
    app: mr7-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
