<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e21227" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e21227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3c3c"/>
      <stop offset="100%" stop-color="#e21227"/>
    </linearGradient>
  </defs>
  <!-- Background glow -->
  <circle cx="100" cy="100" r="95" fill="url(#glow)"/>
  <!-- Hexagon border -->
  <polygon points="100,12 178,56 178,144 100,188 22,144 22,56"
    stroke="url(#grad)" stroke-width="2.5" fill="none" opacity="0.7"/>
  <!-- Inner hexagon -->
  <polygon points="100,32 162,68 162,132 100,168 38,132 38,68"
    stroke="#e21227" stroke-width="1" fill="#0c0b18" opacity="0.9"/>
  <!-- MR7 text -->
  <text x="100" y="115" font-family="system-ui,-apple-system,monospace" font-size="36"
    font-weight="800" fill="url(#grad)" text-anchor="middle" letter-spacing="-1">MR7</text>
  <!-- AI label -->
  <text x="100" y="140" font-family="system-ui,-apple-system,monospace" font-size="14"
    font-weight="600" fill="#e21227" text-anchor="middle" letter-spacing="6" opacity="0.8">AI</text>
  <!-- Corner accents -->
  <line x1="100" y1="12" x2="100" y2="28" stroke="#e21227" stroke-width="2"/>
  <line x1="100" y1="172" x2="100" y2="188" stroke="#e21227" stroke-width="2"/>
</svg>
