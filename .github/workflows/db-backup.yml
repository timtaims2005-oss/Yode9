name: Database Backup

# Daily pg_dump of DATABASE_URL, uploaded to all configured storage backends
# (Amazon S3, Cloudflare R2, Google Cloud Storage). Each destination is
# skipped automatically if its secrets are not configured, so this workflow
# works with any subset of backends enabled.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump & upload database backup
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create dump
        id: dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret is not set — cannot back up." >&2
            exit 1
          fi
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          FILE="mr7ai-db-backup-${STAMP}.sql.gz"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip -9 > "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Backup size: $(du -h "$FILE" | cut -f1)"

      # ── Amazon S3 ────────────────────────────────────────────────────────────
      - name: Upload to Amazon S3
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_S3_BACKUP_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          pip install --quiet awscli
          aws s3 cp "${{ steps.dump.outputs.file }}" \
            "s3://${{ secrets.AWS_S3_BACKUP_BUCKET }}/db-backups/${{ steps.dump.outputs.file }}"
          echo "✓ Uploaded to S3"

      # ── Cloudflare R2 (S3-compatible) ─────────────────────────────────────────
      - name: Upload to Cloudflare R2
        if: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_BACKUP_BUCKET != '' && secrets.R2_ENDPOINT != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          pip install --quiet awscli
          aws s3 cp "${{ steps.dump.outputs.file }}" \
            "s3://${{ secrets.R2_BACKUP_BUCKET }}/db-backups/${{ steps.dump.outputs.file }}" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          echo "✓ Uploaded to Cloudflare R2"

      # ── Google Cloud Storage ──────────────────────────────────────────────────
      - name: Authenticate to GCP
        if: ${{ secrets.GCP_SA_KEY != '' && secrets.GCS_BACKUP_BUCKET != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ secrets.GCP_SA_KEY != '' && secrets.GCS_BACKUP_BUCKET != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to Google Cloud Storage
        if: ${{ secrets.GCP_SA_KEY != '' && secrets.GCS_BACKUP_BUCKET != '' }}
        run: |
          set -euo pipefail
          gcloud storage cp "${{ steps.dump.outputs.file }}" \
            "gs://${{ secrets.GCS_BACKUP_BUCKET }}/db-backups/${{ steps.dump.outputs.file }}"
          echo "✓ Uploaded to GCS"

      - name: Warn if no backend configured
        if: ${{ secrets.AWS_ACCESS_KEY_ID == '' && secrets.R2_ACCESS_KEY_ID == '' && secrets.GCP_SA_KEY == '' }}
        run: |
          echo "::warning::No backup storage backend is configured (S3/R2/GCS secrets missing). Dump was created but not uploaded anywhere."

      - name: Clean up local dump
        if: always()
        run: rm -f "${{ steps.dump.outputs.file }}"
