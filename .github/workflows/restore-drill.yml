name: Backup Restore Drill

# Verifies the latest automated backup can actually be restored.
# Manual-only (workflow_dispatch) — takes longer than normal CI and needs a
# throwaway database, so it does not run on every push.
#
# Run it from: Actions tab → "Backup Restore Drill" → "Run workflow"

on:
  workflow_dispatch: {}

jobs:
  restore-drill:
    name: Restore latest backup into a disposable test database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restore_drill
          POSTGRES_PASSWORD: restore_drill
          POSTGRES_DB: restore_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client + awscli
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pip install --quiet awscli

      - name: Run restore drill
        env:
          # Source backup (same secrets used by db-backup.yml)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          AWS_S3_BACKUP_BUCKET: ${{ secrets.AWS_S3_BACKUP_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          # Disposable target — the Postgres service container above, never production
          TEST_DATABASE_URL: postgres://restore_drill:restore_drill@localhost:5432/restore_drill
        run: |
          chmod +x ./scripts/restore-backup-test.sh
          ./scripts/restore-backup-test.sh

      - name: Summary
        if: always()
        run: |
          echo "### Backup Restore Drill" >> "$GITHUB_STEP_SUMMARY"
          echo "See the 'Run restore drill' step log above for table/row counts." >> "$GITHUB_STEP_SUMMARY"
