name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript / Frontend ────────────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @workspace/mr7-ai run typecheck

      - name: Build frontend
        run: pnpm --filter @workspace/mr7-ai run build

  # ── API Server ───────────────────────────────────────────────────────────────
  api-server:
    name: API Server (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Run API server tests
        run: pnpm --filter @workspace/api-server run test
        env:
          SESSION_SECRET: ci-test-secret
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///ci_test.db' }}

  # ── Python / Flask backend ───────────────────────────────────────────────────
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pentest-lab/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Lint with ruff (non-blocking)
        run: pip install ruff --quiet && ruff check . --exit-zero

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pip install pytest --quiet
            pytest tests/ -v --tb=short
          else
            echo "No tests directory found — skipping"
          fi
        env:
          SESSION_SECRET: ci-test-secret
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///ci_test.db' }}

  # ── Security Scan ─────────────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: [frontend, api-server]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true
