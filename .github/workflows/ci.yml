name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript / Frontend ────────────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @workspace/mr7-ai run typecheck

      - name: Build frontend
        run: pnpm --filter @workspace/mr7-ai run build

  # ── API Server ───────────────────────────────────────────────────────────────
  api-server:
    name: API Server (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Run API server tests
        run: pnpm --filter @workspace/api-server run test
        env:
          SESSION_SECRET: ci-test-secret
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///ci_test.db' }}

  # ── Python / Flask backend ───────────────────────────────────────────────────
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pentest-lab/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Lint with ruff (non-blocking)
        run: pip install ruff --quiet && ruff check . --exit-zero

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pip install pytest --quiet
            pytest tests/ -v --tb=short
          else
            echo "No tests directory found — skipping"
          fi
        env:
          SESSION_SECRET: ci-test-secret
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///ci_test.db' }}

  # ── Security Scan ─────────────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: [frontend, api-server]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true

  # ── Docker Build & Push (main only) ───────────────────────────────────────────
  docker-build:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [frontend, api-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build & push API server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ai-production
          target: api-production
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mr7-api:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/mr7-api:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ai-production
          target: frontend-production
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/mr7-frontend:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/mr7-frontend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
